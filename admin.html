<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMS Dashboard - GRAHMS TECH</title>
  <link rel="stylesheet" href="style.css">

  <!-- Vercel Speed Insights -->
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>

  <header>
    <div class="logo">Publisher CMS</div>
    <a href="/" style="color: var(--accent-cyan); text-decoration: none; font-size: 0.9rem;">&larr; Back to Site</a>
  </header>

  <main style="max-width: 600px; margin: 0 auto;">
    <form id="post-form" style="background: var(--card-bg); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border-color);">
      <h2 style="margin-bottom: 1rem; font-size: 1.2rem;">Create New Article</h2>

      <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" required placeholder="Enter article title">
      </div>

      <div class="form-group">
        <label for="category">Category</label>
        <select id="category">
          <option value="Gadgets">Gadgets</option>
          <option value="AutoTech">AutoTech</option>
          <option value="Information Tech">Information Tech</option>
          <option value="AI & Hardware">AI & Hardware</option>
        </select>
      </div>

      <div class="form-group">
        <label for="imageUrl">Cover Image URL</label>
        <input type="url" id="imageUrl" placeholder="https://images.unsplash.com/photo-...">
      </div>

      <div class="form-group">
        <label for="excerpt">Excerpt</label>
        <input type="text" id="excerpt" placeholder="Brief summary">
      </div>

      <div class="form-group">
        <label for="content">Full Article Content</label>
        <textarea id="content" rows="6" required placeholder="Write article content..."></textarea>
      </div>

      <button type="submit" class="btn-publish" style="width: 100%;">Publish Article</button>
    </form>
  </main>

  <script>
    document.getElementById('post-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        title: document.getElementById('title').value,
        category: document.getElementById('category').value,
        image_url: document.getElementById('imageUrl').value,
        excerpt: document.getElementById('excerpt').value,
        content: document.getElementById('content').value
      };

      try {
        const res = await fetch('/api/posts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          alert('Article Published Successfully!');
          window.location.href = '/';
        } else {
          alert('Failed to publish article.');
        }
      } catch (err) {
        console.error(err);
        alert('Server connection error.');
      }
    });
  </script>
</body>
</html>
